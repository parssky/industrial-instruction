name: Feature request
description: Propose a new capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could the package support it? Config keys, CLI, or a plug-in point?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
